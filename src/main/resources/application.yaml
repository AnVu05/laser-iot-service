server:
  port: ${PORT:8081}

spring:
  application:
    name: laser-iot-service

app:
  # Secret key bảo vệ Internal API giao tiếp với Web Backend
  internal-secret-key: ${INTERNAL_SECRET_KEY:laser-internal-secret-key-change-me}
  storage:
    gcode-dir: ${STORAGE_GCODE_DIR:/tmp/gcode-cache}
  device:
    default-code: LASER-HN-001
    default-token: ${DEVICE_DEFAULT_TOKEN:mks-dlc32-secret-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.anne.laseriot: DEBUG
